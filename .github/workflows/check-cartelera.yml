name: Chequear Cartelera Virtual

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright/python:v1.47.0-jammy
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Ejecutar scraper
        env:
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python scraper.py

      - name: Guardar avisos vistos
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "cartelera-bot"
          git config user.email "actions@github.com"
          git add data/seen.json
          git diff --quiet --cached || git commit -m "Actualizar avisos vistos"
          git push
